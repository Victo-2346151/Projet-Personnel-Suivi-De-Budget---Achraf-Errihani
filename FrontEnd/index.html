<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suivi de Budget </title>
  <!--
    Script d'amorçage du thème clair/sombre (évite le flash du mauvais thème).
    Anthropic. (2026). Claude Code (Claude Sonnet 5) [Modèle massif de
    langage]. https://claude.com/claude-code
  -->
  <script>
    (function () {
      var themeStocke = localStorage.getItem('suiviBudget.theme');
      var theme =
        themeStocke === 'sombre' || themeStocke === 'clair'
          ? themeStocke
          : window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'clair'
            : 'sombre';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
